<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Scott Baker">
    <meta name="description" content="White Water professional rafting tour. We offer guided tours on white water rafting
        adventure, all safety equipment provided. Contact Us">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us The Rapids!</title>
</head>

<body>
    <header>
        <div>
            <img src="images/logo.jpg" alt="logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>

    </header>
    <main>
        <div class="contact">
            <h1>The Rapids!</h1>
            <address>
                <p>
                    123 Main River Avenue <br>
                    Somewhere, Utah <br>
                    +1 999 999 9999 <br>
                    info@therapids.com
                </p>
            </address>
        </div>
        <div class="contact-container">
            <div class="map-column">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d10491.809085839632!2d-109.57115993732135!3d38.57447033466085!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x87480b001efd8a9b%3A0x30ed9757cf20a3f3!2sKane%20Creek%20Recreation%20Area!5e0!3m2!1sen!2sus!4v1780686758704!5m2!1sen!2sus"
                    width="400" height="460" allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
            <div class="form-column">
                <form>
                    <div class="form-item column2">
                        <div class="column2">
                            <label for="fullname">Name:</label>
                        </div>
                        <input type="text" id="fullname" name="fullname" placeholder="placeholder">
                    </div>
                    <div class="form-item column2">
                        <div class="column2">
                            <label for="useremail">Email:</label>
                        </div>
                        <input type="email" id="useremail" name="useremail" placeholder="Placeholder">
                    </div>
                    <div class="form-item column2">
                        <div class="column2">
                            <label>Message Purpose</label>
                        </div>
                        <div class="radio-group column1">
                            <label>
                                <input type="radio" name="purpose" id="general" value="general">General Inquiry
                            </label>
                            <label>
                                <input type="radio" name="purpose" id="reservation" value="reservation">Reservation
                                Question
                            </label>
                            <label>
                                <input type="radio" name="purpose" id="suggestion" value="suggestion">Website
                                Suggestion
                            </label>
                        </div>
                    </div>
                    <div class="form-item">
                        <div class="message-box column2">
                            <label>Message</label>
                        </div>
                        <label for="feedback"></label>
                        <textarea name="feedback" id="feedback" rows="4" placeholder="Type here"></textarea>
                    </div>
                    <div class="checkbox">
                        <input type="checkbox" id="chbx" name="subscribe">
                        <label for="chbx">Please subscribe me to the monthly newsletter </label>
                    </div>
                    <button type="submit">Send message</button>
                </form>

            </div>
        </div>
        <div class="employee-container">
            <h2>We are here to serve you</h2>
            <div class="employee">
                <figure>
                    <img src="images/amanda.jpg" alt="Amanda Johnson, Head Trainer">
                    <figcaption>Amanda<br>Head Trainer</figcaption>
                </figure>
            </div>
            <div class="employee">
                <figure>
                    <img src="images/bryan.jpg" alt="Bryan Smith, Senior Guide">
                    <figcaption>Bryan<br>Senior Guide</figcaption>
                </figure>
            </div>
            <div class="employee">
                <figure>
                    <img src="images/jeremy.jpg" alt="Jeremy Jones, Customer Orientation Specialist">
                    <figcaption>Jeremy<br>Customer Orientation</figcaption>
                </figure>
            </div>

        </div>
    </main>
    <footer>
        <div class="footer-content">
            <p>&copy; 2026 | The Rapids | Scott Baker</p>
            <nav class="socialmedia">
                <a href="https://facebook.com">
                    <img src="images/facebook.jpg" alt="facebook icon">
                </a>
                <a href="https://linkedin.com">
                    <img src="images/linkedin.jpg" alt="linkedin icon">
                </a>
                <a href="https://instagram.com">
                    <img src="images/instagram.jpg" alt="instagram icon">
                </a>
            </nav>
        </div>
    </footer>

</body>

</html>

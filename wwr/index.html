<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Scott Baker">
    <meta name="description"
      content="White Water professional rafting tour. We offer guided tours on white water rafting adventure, all safety equipment provided">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Home</title>
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="the rapids brand logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="hero">
            <img src="images/hero2.jpg" alt="family of rafters" class="hero-big-image">
            <h1>The adventure of a lifetime.</h1>

        </div>
        <div class="information-container">
            <div class="camping-column">
                <h2>Get ready for fun</h2>
                <div class="camping">
                    <figure>
                        <img src="images/Hells-Canyon-of-the-Snake-Rafting-Camp-Tme-scaled.jpg"
                          alt="Day trips">
                        <figcaption>Day Trips with free meal<br>Enjoy the outdoors</figcaption>
                    </figure>
                </div>
                <div class="camping">
                    <figure>
                        <img src="images/rafting-gear-essentials.jpg" alt="rafting equipment">
                        <figcaption>All rafting equipment supplied</figcaption>
                    </figure>
                </div>
                <div class="camping">
                    <figure>
                        <img src="images/tent-positioned-on-river-bank-free-photo.jpg"
                          alt="overnight camping">
                        <figcaption>Overnight trips available <br>All supplies included</figcaption>
                    </figure>
                </div>
            </div>
            <div class="form-column-home">
                <form>
                    <div class="form-item column2-home">
                        <div class="column2-home">
                            <label for="fullname">Name:</label>
                        </div>
                        <input type="text" id="fullname" name="fullname" placeholder="placeholder">
                    </div>
                    <div class="form-item column2-home">
                        <div class="column2">
                            <label for="useremail">Email:</label>
                        </div>
                        <input type="email" id="useremail" name="useremail"
                          placeholder="Placeholder">
                    </div>
                    <div class="form-item column1-home">

                        <div class="checkbox-home">
                            <input type="checkbox" id="chbx" name="subscribe">
                            <label for="chbx">Please subscribe me to the monthly newsletter </label>

                        </div>

                    </div>
                    <button type="submit">Sign up</button>


                </form>

            </div>
        </div>

    </main>
    <footer>
        <div class="footer-content">
            <p>&copy; 2026 | The Rapids! | Scott Baker</p>
            <nav class="socialmedia">
                <a href="https://facebook.com">
                    <img src="images/facebook.jpg" alt="facebook">
                </a>
                <a href="https://linkedin.com">
                    <img src="images/linkedin.jpg" alt="linkedin">
                </a>
                <a href="https://instagram.com">
                    <img src="images/instagram.jpg" alt="instagram">
                </a>
            </nav>
        </div>
    </footer>
</body>

</html>
